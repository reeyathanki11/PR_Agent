name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:

  review:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Run Agent
        env:
          GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_MODEL: gpt-4o-mini
        run: |
          python run_agent.py