# .github/workflows/pr_review.yml

name: AI PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

# ✅ THIS IS THE KEY FIX — explicitly grant write permissions
permissions:
  contents: read
  pull-requests: write      # needed to post PR comments
  issues: write             # needed for create_issue_comment

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PR Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ✅ auto-provided, no setup needed
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python run_agent.py